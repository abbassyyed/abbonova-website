<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABBONOVA IT Services</title>
<style>
:root {
  --dark: #0a192f;
  --light: #ffffff;
  --accent: #00bcd4;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: var(--dark);
  color: var(--light);
}

/* HEADER */
header {
  position: relative;
  background: rgba(10, 25, 47, 0.85);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 80px;
  padding: 0 20px;
}

.center-logo img {
  height: 50px;
}

.header-bar {
  position: fixed;
  top: 15px;
  left: 80px;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--light);
  font-weight: bold;
  font-size: 18px;
  user-select: none;
}

.toggle-btn {
  background: none;
  border: none;
  color: var(--light);
  font-size: 26px;
  cursor: pointer;
}

@media (max-width: 768px) {
  .header-bar {
    left: 20px;
    font-size: 16px;
    right: 70px;
  }
}

/* SIDEBAR */
#sidebarNav {
  position: fixed;
  top: 0;
  right: -260px;
  width: 260px;
  height: 100%;
  background: rgba(10, 25, 47, 0.97);
  padding-top: 80px;
  transition: right 0.3s ease;
  z-index: 200;
}

#sidebarNav.active {
  right: 0;
}

#sidebarNav ul {
  list-style: none;
}

#sidebarNav li {
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

#sidebarNav a {
  display: block;
  padding: 14px 20px;
  color: var(--light);
  text-decoration: none;
}

#sidebarNav a:hover {
  background: var(--accent);
}

/* SUBMENU */
.submenu {
  display: none;
  background: rgba(255, 255, 255, 0.05);
}

.submenu a {
  padding-left: 40px;
}

.submenu.active {
  display: block;
}

@media (min-width: 769px) {
  #sidebarNav {
    position: static;
    height: auto;
    width: auto;
    background: none;
    display: flex;
    padding: 0;
    transition: none;
  }

  #sidebarNav ul {
    display: flex;
    gap: 20px;
  }

  #sidebarNav li {
    border: none;
    position: relative;
  }

  #sidebarNav a {
    padding: 0;
  }

  /* Desktop submenu hover */
  .has-submenu:hover .submenu {
    display: block;
    position: absolute;
    background: rgba(10, 25, 47, 0.95);
    top: 100%;
    left: 0;
    min-width: 200px;
  }
}
</style>
</head>
<body>

<header>
  <div class="center-logo">
    <a href="#">
      <img src="assets/images/logo.png" alt="Abbonova Logo" />
    </a>
  </div>

  <div class="header-bar">
    <h1 class="company-name">ABBONOVA IT SERVICES</h1>
    <button class="toggle-btn" id="toggleBtn" aria-label="Toggle Menu">☰</button>
  </div>

  <nav id="sidebarNav">
    <ul>
      <li><a href="#">Home</a></li>
      <li class="has-submenu">
        <a href="#" class="services-link">Services</a>
        <ul class="submenu">
          <li><a href="#">IT Services</a></li>
          <li><a href="#">General Trading</a></li>
        </ul>
      </li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</header>

<main>
  <section style="padding: 50px; text-align:center;">
    <h2>Welcome to ABBONOVA IT Services</h2>
    <p>Your content here...</p>
  </section>
</main>

<script>
const toggleBtn = document.getElementById('toggleBtn');
const sidebarNav = document.getElementById('sidebarNav');
const servicesLink = document.querySelector('.services-link');
const submenu = document.querySelector('.submenu');

toggleBtn.addEventListener('click', () => {
  sidebarNav.classList.toggle('active');
  toggleBtn.textContent = sidebarNav.classList.contains('active') ? '→' : '☰';
});

servicesLink.addEventListener('click', (e) => {
  if (window.innerWidth <= 768) {
    e.preventDefault();
    submenu.classList.toggle('active');
  }
});
</script>

</body>
</html>
