<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABBONOVA IT Services</title>
<style>
:root {
  --dark: #0a1a2f;
  --light: #ffffff;
  --blue: #0066cc;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--dark);
  color: var(--light);
}

/* Header */
header {
  position: relative;
  padding: 10px;
}

.center-logo {
  text-align: center;
}

.center-logo img {
  width: 80px;
}

.header-bar {
  position: fixed;
  top: 10px;
  left: 20px;
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: bold;
  font-size: 18px;
  color: var(--light);
}

.toggle-btn {
  margin-left: auto;
  font-size: 24px;
  background: none;
  border: none;
  color: var(--light);
  cursor: pointer;
  z-index: 400;
}

/* Sidebar menu */
nav#sidebarNav {
  position: fixed;
  top: 0;
  right: -260px;
  width: 250px;
  height: 100%;
  background: var(--dark);
  box-shadow: -2px 0 5px rgba(0,0,0,0.5);
  transition: right 0.3s ease;
  padding-top: 60px;
}

nav#sidebarNav.open {
  right: 0;
}

nav#sidebarNav ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

nav#sidebarNav ul li {
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

nav#sidebarNav ul li a {
  display: block;
  padding: 12px 20px;
  color: var(--light);
  text-decoration: none;
}

nav#sidebarNav ul li a:hover {
  background: var(--blue);
}

/* Submenu styling */
.submenu {
  display: none;
  background: rgba(255,255,255,0.05);
}
.submenu li a {
  padding-left: 40px;
}
.has-submenu.open > .submenu {
  display: block;
}

@media (min-width: 769px) {
  .toggle-btn {
    display: none;
  }
  nav#sidebarNav {
    position: static;
    width: auto;
    height: auto;
    box-shadow: none;
    padding-top: 0;
    display: block !important;
  }
  nav#sidebarNav ul {
    display: flex;
  }
  nav#sidebarNav ul li {
    border: none;
  }
  nav#sidebarNav ul li a {
    padding: 10px 15px;
  }
  .submenu {
    position: absolute;
    background: var(--dark);
    display: none;
    min-width: 160px;
  }
  .has-submenu:hover .submenu {
    display: block;
  }
}
</style>
</head>
<body>

<header>
  <div class="center-logo">
    <a href="https://www.abbonova.com">
      <img src="assets/images/logo.png" alt="Abbonova Logo" />
    </a>
  </div>

  <div class="header-bar">
    <span>ABBONOVA IT SERVICES</span>
    <button class="toggle-btn" id="toggleBtn" aria-label="Toggle Menu">☰</button>
  </div>

  <nav id="sidebarNav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li class="has-submenu">
        <a href="#" class="services-link">Services</a>
        <ul class="submenu">
          <li><a href="it-services.html">IT Services</a></li>
          <li><a href="general-trading.html">General Trading</a></li>
        </ul>
      </li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<script>
const toggleBtn = document.getElementById('toggleBtn');
const sidebarNav = document.getElementById('sidebarNav');
const servicesLink = document.querySelector('.services-link');
const hasSubmenu = document.querySelector('.has-submenu');

toggleBtn.addEventListener('click', () => {
  sidebarNav.classList.toggle('open');
  toggleBtn.textContent = sidebarNav.classList.contains('open') ? '→' : '☰';
});

servicesLink.addEventListener('click', (e) => {
  if (window.innerWidth < 769) {
    e.preventDefault();
    hasSubmenu.classList.toggle('open');
  }
});
</script>

</body>
</html>
